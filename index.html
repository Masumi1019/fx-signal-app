<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FX Signal</title>
<style>
body {
  font-family: sans-serif;
  background: #f4f6f8;
  margin: 0;
  padding: 20px;
}
.card {
  background: white;
  padding: 20px;
  border-radius: 16px;
  margin-bottom: 15px;
}
h1 { margin-bottom: 5px; }
.signal {
  font-size: 32px;
  font-weight: bold;
}
.wait { color: #777; }
</style>
</head>

<body>

<h1>FX SIGNAL</h1>
<p>USD/JPY トレード判断</p>

<div class="card">
<h2>15分足</h2>
<p>ダウ理論：―</p>
<p>水平線：―</p>
<p>移動平均線：―</p>
<p>RSI：―</p>
</div>

<div class="card">
<h2>5分足</h2>
<p>エントリータイミング：待機</p>
</div>

<div class="card">
<h2>総合判定</h2>
<div class="signal wait">⚪ WAIT</div>
</div>

</body>
</html>
